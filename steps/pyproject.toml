[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["crawlbase", "crawlbase.*", "openai", "openai.*", "selectolax", "selectolax.*", "dotenv"]
ignore_missing_imports = true
